
name: Build Authorized Shorts Queue

on:
  workflow_run:
    workflows: ["GTA6 Global Discovery"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download discovery report
        uses: actions/download-artifact@v4
        with:
          name: gta6-discovery-report
          path: reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build authorized queue
        run: python queue_builder.py

      - name: Save approved queue
        uses: actions/upload-artifact@v4
        with:
          name: gta6-approved-queue
          path: data/trend_queue.json
          if-no-files-found: error
          retention-days: 7
