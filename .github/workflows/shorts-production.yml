
name: GTA6 Shorts Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create input folder
        run: mkdir -p input_videos

      - name: Detect highlights
        run: python highlight_detector.py

      - name: Generate vertical Shorts
        run: python shorts_generator.py

      - name: Save production report and videos
        uses: actions/upload-artifact@v4
        with:
          name: gta6-shorts-production
          path: |
            data/highlight_candidates.json
            output_shorts/
          if-no-files-found: warn
          retention-days: 7
