
name: GTA6 Highlight Detection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run highlight detector
        run: python highlight_detector.py

      - name: Save highlight report
        uses: actions/upload-artifact@v4
        with:
          name: gta6-highlight-candidates
          path: data/highlight_candidates.json
          if-no-files-found: error
          retention-days: 7
