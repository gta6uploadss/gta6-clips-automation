name: GTA6 Global Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run global discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python discovery.py

      - name: Save historical data to repository
        run: |
          if [ -f data/history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/history.json

            if ! git diff --cached --quiet; then
              git commit -m "Update GTA 6 discovery history"
              git push
            else
              echo "No history changes to save."
            fi
          else
            echo "History file not created yet. Skipping save."
          fi

      - name: Save discovery report
        uses: actions/upload-artifact@v4
        with:
          name: gta6-discovery-report
          path: reports/
          retention-days: 7
